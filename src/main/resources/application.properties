# ===================================================
# CONFIGURA플O GERAL DA APLICA플O
# ===================================================
spring.application.name=SpringBootList
# ===================================================
# CONFIGURA플O DA FONTE DE DADOS (DATASOURCE - MYSQL)
# ===================================================
spring.datasource.url = jdbc:mysql://localhost:3306/sales?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = 1234
# ===================================================
# CONFIGURA플O DO JPA / HIBERNATE
# ===================================================
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
# ===================================================
# CONFIGURA플O DO THYMELEAF
# ===================================================
spring.thymeleaf.cache = false
